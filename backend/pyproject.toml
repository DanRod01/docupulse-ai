[project]
name = "docupulse-backend"
version = "0.1.0"
description = "DocuPulse AI Backend & Hybrid RAG Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "google-generativeai>=0.8.0",
    "polars>=1.6.0",
    "duckdb>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1"
]

[tool.ruff]
line-length = 88
target-version = "py311"
